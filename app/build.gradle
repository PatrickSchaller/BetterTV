plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bettertv.launcher'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.bettertv.launcher'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.1'
        testInstrumentationRunner 'com.bettertv.launcher.SearchInstrumentation'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('.tools/debug.keystore')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
